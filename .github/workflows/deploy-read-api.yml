name: Deploy DynamoDB read API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dynamodb-read-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  DYNAMODB_TABLE: f1-website-data
  FUNCTION_NAME: f1-website-seasons-api
  API_NAME: f1-website-seasons-api
  EXECUTION_ROLE_NAME: f1-website-api-lambda
  CORS_ORIGIN: https://f1datadesktop.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure temporary AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_UPDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda bundle
        run: |
          rm -rf .aws-api-build f1-api.zip
          mkdir .aws-api-build
          npx esbuild aws/lambda/seasons.js \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=cjs \
            --outfile=.aws-api-build/index.js
          cd .aws-api-build
          zip -q ../f1-api.zip index.js

      - name: Ensure read-only Lambda role
        id: execution-role
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          role_arn="arn:aws:iam::${account_id}:role/${EXECUTION_ROLE_NAME}"

          if ! aws iam get-role --role-name "$EXECUTION_ROLE_NAME" >/dev/null 2>&1; then
            aws iam create-role \
              --role-name "$EXECUTION_ROLE_NAME" \
              --assume-role-policy-document file://aws/iam/f1website-api-lambda-trust-policy.json
          fi

          aws iam put-role-policy \
            --role-name "$EXECUTION_ROLE_NAME" \
            --policy-name f1-website-api-read-runtime \
            --policy-document file://aws/iam/f1website-api-read-runtime-policy.json

          echo "role_arn=$role_arn" >> "$GITHUB_OUTPUT"
          sleep 10

      - name: Deploy read Lambda
        run: |
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://$GITHUB_WORKSPACE/f1-api.zip"
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs22.x \
              --handler index.handler \
              --role "${{ steps.execution-role.outputs.role_arn }}" \
              --timeout 15 \
              --memory-size 256 \
              --environment "Variables={DYNAMODB_TABLE=${DYNAMODB_TABLE},CORS_ORIGIN=${CORS_ORIGIN}}"
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs22.x \
              --handler index.handler \
              --role "${{ steps.execution-role.outputs.role_arn }}" \
              --zip-file "fileb://$GITHUB_WORKSPACE/f1-api.zip" \
              --timeout 15 \
              --memory-size 256 \
              --environment "Variables={DYNAMODB_TABLE=${DYNAMODB_TABLE},CORS_ORIGIN=${CORS_ORIGIN}}"
          fi

          aws lambda wait function-active-v2 --function-name "$FUNCTION_NAME"

      - name: Configure public HTTP API
        id: api
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          function_arn="$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query FunctionArn \
            --output text)"
          api_id="$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${API_NAME}'].ApiId | [0]" \
            --output text)"

          if [[ -z "$api_id" || "$api_id" == "None" ]]; then
            api_id="$(aws apigatewayv2 create-api \
              --name "$API_NAME" \
              --protocol-type HTTP \
              --target "$function_arn" \
              --cors-configuration "{\"AllowOrigins\":[\"${CORS_ORIGIN}\"],\"AllowMethods\":[\"GET\",\"OPTIONS\"],\"AllowHeaders\":[\"content-type\"],\"MaxAge\":300}" \
              --query ApiId \
              --output text)"
          else
            aws apigatewayv2 update-api \
              --api-id "$api_id" \
              --cors-configuration "{\"AllowOrigins\":[\"${CORS_ORIGIN}\"],\"AllowMethods\":[\"GET\",\"OPTIONS\"],\"AllowHeaders\":[\"content-type\"],\"MaxAge\":300}"
          fi

          aws apigatewayv2 update-stage \
            --api-id "$api_id" \
            --stage-name '$default' \
            --default-route-settings ThrottlingBurstLimit=20,ThrottlingRateLimit=10

          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id apigateway-read-api \
            >/dev/null 2>&1 || true
          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id apigateway-read-api \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${AWS_REGION}:${account_id}:${api_id}/*/*"

          api_endpoint="https://${api_id}.execute-api.${AWS_REGION}.amazonaws.com"
          echo "endpoint=$api_endpoint" >> "$GITHUB_OUTPUT"
          echo "### DynamoDB read API" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$api_endpoint\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify API
        run: |
          curl --fail --silent --show-error \
            "${{ steps.api.outputs.endpoint }}/api/seasons/2026/summary"
          curl --fail --silent --show-error \
            "${{ steps.api.outputs.endpoint }}/api/seasons/2026/analytics" \
            >/dev/null
