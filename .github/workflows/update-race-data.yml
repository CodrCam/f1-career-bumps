name: Update 2026 race data

on:
  workflow_dispatch:
    inputs:
      round:
        description: Round number; blank uses the latest completed race
        required: false
        type: string
  schedule:
    - cron: "20 12 * * 1,2"

permissions:
  contents: read
  id-token: write

concurrency:
  group: update-2026-race-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-west-2
      DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'f1-website-data' }}
      F1_RAW_DATA_BUCKET: ${{ vars.F1_RAW_DATA_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fastf1.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-fastf1.txt

      - name: Configure temporary AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_UPDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the latest completed race and require publishable analytics
        env:
          INPUT_ROUND: ${{ inputs.round }}
          FASTF1_PYTHON: python
        run: |
          args=(--year 2026 --retries 3 --retry-delay 45000)
          if [[ -n "$INPUT_ROUND" ]]; then args+=(--round "$INPUT_ROUND"); fi
          npm run pipeline:update -- "${args[@]}"
