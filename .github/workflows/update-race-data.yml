name: Update 2026 race data

on:
  workflow_dispatch:
    inputs:
      round:
        description: Round number; blank uses the latest completed race
        required: false
        type: string
  schedule:
    - cron: "20 */6 * * 0,1,2"

permissions:
  contents: read
  id-token: write

concurrency:
  group: update-2026-race-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AWS_REGION: us-west-2
      DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'f1-website-data' }}
      F1_RAW_DATA_BUCKET: ${{ vars.F1_RAW_DATA_BUCKET }}
      TIMING_SOURCE_ID: slipstream-owned

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify owned publication code
        run: node --test server/ownedTimingMaterializer.test.js server/ownedRacePublication.test.js server/sourceValidation.test.js

      - name: Configure temporary AWS access
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_UPDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh every unpublished completed race
        env:
          INPUT_ROUND: ${{ inputs.round }}
        run: |
          if [[ -n "$INPUT_ROUND" ]]; then
            npm run pipeline:update -- \
              --year 2026 \
              --round "$INPUT_ROUND"
          else
            npm run pipeline:refresh -- \
              --year 2026 \
              --max-rounds 2
          fi

      - name: Record publication result
        if: always()
        run: |
          echo "### Owned timing publication" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed timing source: Slipstream recorder and event ledger." >> "$GITHUB_STEP_SUMMARY"
          echo "A missing upstream session is deferred without a third-party fallback." >> "$GITHUB_STEP_SUMMARY"
